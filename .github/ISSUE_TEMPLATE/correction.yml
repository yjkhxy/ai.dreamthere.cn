name: 资料纠错
description: 反馈工具资料、指南或链接问题
title: "[纠错] "
body:
  - type: input
    id: page
    attributes:
      label: 受影响页面
      description: 请提供完整页面 URL。
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: 实际观察与建议
      description: 说明预期与实际情况，以及适用的套餐、地区等条件。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 官方依据
      description: 提供官方说明链接；无法核实请注明待确认。不要提交敏感信息。
    validations:
      required: true
  - type: input
    id: checked_on
    attributes:
      label: 检查日期
      placeholder: YYYY-MM-DD
    validations:
      required: true
